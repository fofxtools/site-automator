[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "site-automator"
version = "0.1.1"
description = "A Python tool for provisioning and deploying WordPress sites using WordOps and WP-CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "ollama",
  "openai",
  "paramiko",
  "pydo",
  "python-dotenv",
  "python-slugify",
  "requests",
  "types-PyYAML",
]

[project.optional-dependencies]
dev = [
  "black",
  "faker",
  "mypy",
  "pytest",
  "ruff",
  "types-paramiko",
  "types-requests",
  "responses",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false